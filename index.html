    // =========================================================================
    // SEGURIDAD: Función de escape HTML para prevenir XSS
    // Sanitiza cualquier dato de usuario antes de inyectar en el DOM
    // =========================================================================
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;')
        .replace(/`/g, '&#96;');
    }

    // Valida que una URL sea segura (solo http/https, no javascript:, data:, etc.)
    function sanitizeUrl(url) {
      if (!url) return '#';
      try {
        const u = new URL(url);
        if (u.protocol !== 'https:' && u.protocol !== 'http:') return '#';
        return u.href;
      } catch {
        // Si no es una URL absoluta válida, rechazarla
        if (url.startsWith('/') || url.startsWith('./')) return url;
        return '#';
      }
    }

    // Valida que un número de WhatsApp solo contenga dígitos (evita inyección en URLs)

    // =========================================================================
    // HELPER: HORARIOS COLOMBIA (Abierto / Cerrado)
    // =========================================================================
    function getBusinessStatus(schedule) {
      if (!schedule) return { isOpen: false, label: 'Consultar Horario', color: 'bg-slate-100 text-slate-700' };
      const now = new Date();
      const days = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
      const today = days[now.getDay()];
      const dayConf = schedule[today];
      if (!dayConf || dayConf.closed) return { isOpen: false, label: 'Cerrado hoy', color: 'bg-rose-50 text-rose-700 border-rose-200' };
      
      const currentMin = (now.getHours() * 60) + now.getMinutes();
      const [oh, om] = dayConf.open ? dayConf.open.split(':').map(Number) : [8, 0];
      const [ch, cm] = dayConf.close ? dayConf.close.split(':').map(Number) : [20, 0];
      const openMin = (oh * 60) + om;
      const closeMin = (ch * 60) + cm;

      if (currentMin >= openMin && currentMin < closeMin) {
        return { isOpen: true, label: `🟢 Abierto ahora (hasta las ${dayConf.close || '20:00'})`, color: 'bg-emerald-50 text-emerald-800 border-emerald-300' };
      }
      return { isOpen: false, label: `🔴 Cerrado (Abre hoy a las ${dayConf.open || '08:00'})`, color: 'bg-slate-100 text-slate-700 border-slate-300' };
    }

    function getTransporterStatus(t) {
      if (!t) return { isOpen: true, label: '🟢 Disponible', color: 'bg-emerald-50 text-emerald-800 border-emerald-300' };
      const now = new Date();
      const dayNames = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const today = dayNames[now.getDay()];

      // Verificar si labora hoy
      const worksToday = !t.work_days || t.work_days.includes('Todos') || t.work_days.includes(today);
      if (!worksToday) {
        return { isOpen: false, label: '🔴 No labora hoy', color: 'bg-rose-50 text-rose-700 border-rose-200' };
      }

      const openStr = t.work_open || '06:00';
      const closeStr = t.work_close || '20:00';
      const [oh, om] = openStr.split(':').map(Number);
      const [ch, cm] = closeStr.split(':').map(Number);
      const currentMin = (now.getHours() * 60) + now.getMinutes();
      const openMin = (oh * 60) + om;
      const closeMin = (ch * 60) + cm;

      if (currentMin >= openMin && currentMin < closeMin) {
        return { isOpen: true, label: `🟢 En servicio ahora (hasta ${closeStr})`, color: 'bg-emerald-50 text-emerald-800 border-emerald-300' };
      }
      return { isOpen: false, label: `🔴 Fuera de horario (Abre ${openStr})`, color: 'bg-slate-100 text-slate-700 border-slate-300' };
    }

    // =========================================================================
    // CONTADOR DE CONTACTOS (MÉTRICAS PARA EL COMERCIANTE / CONDUCTOR)
    // =========================================================================
    window.trackContactClick = async function(type, id, name) {
      if (!state.contactStats[id]) {
        state.contactStats[id] = { total: 0, whatsapp: 0, calls: 0, lastContact: null };
      }
      state.contactStats[id].total = (state.contactStats[id].total || 0) + 1;
      if (type === 'whatsapp') state.contactStats[id].whatsapp = (state.contactStats[id].whatsapp || 0) + 1;
      if (type === 'call') state.contactStats[id].calls = (state.contactStats[id].calls || 0) + 1;
      state.contactStats[id].lastContact = new Date().toISOString();

      localStorage.setItem('cis_contact_stats', JSON.stringify(state.contactStats));

      if (supabaseClient) {
        try {
          await supabaseClient.from('analytics_clicks').insert([{
            target_id: id,
            target_name: name,
            click_type: type,
            created_at: new Date().toISOString()
          }]);
        } catch (e) {
          // Si la tabla no existe o falla, se guarda localmente sin interrumpir
        }
      }
    };

    // =========================================================================
    // HELPER: WHATSAPP MINI-CARRO FORMATTER
    // =========================================================================
    function getWhatsAppUrl(business, cart, details) {
      let cleanPhone = business.whatsapp_number.replace(/\D/g, '');
      if (!cleanPhone.startsWith('57')) cleanPhone = '57' + cleanPhone;

      const subtotal = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
      const delivery = business.delivery_available ? Number(business.delivery_cost || 0) : 0;
      const total = subtotal + delivery;

      let msg = `👋 *¡Hola, ${business.name}!* \n`;
      msg += `Vengo de la app *Cisneros Emprende* y quiero realizar este pedido:\n\n`;
      msg += `🛍️ *PRODUCTOS:*\n`;
      cart.forEach(i => {
        msg += `• *${i.quantity}x* ${i.name} ($${(i.price * i.quantity).toLocaleString('es-CO')})\n`;
      });
      msg += `\n💰 *VALOR TOTAL:*\n`;
      msg += `• Subtotal: $${subtotal.toLocaleString('es-CO')}\n`;
      msg += `• Domicilio: ${delivery === 0 ? '¡Gratis!' : `$${delivery.toLocaleString('es-CO')}`}\n`;
      msg += `👉 *TOTAL A PAGAR: $${total.toLocaleString('es-CO')}*\n\n`;
      msg += `📍 *DATOS DE ENTREGA EN CISNEROS:*\n`;
      msg += `• Dirección: ${details.address}\n`;
      if (details.reference) msg += `• Punto de referencia: ${details.reference}\n`;
      msg += `• Pago con: ${details.paymentMethod}\n`;
      if (details.name) msg += `• Nombre: ${details.name}\n`;
      msg += `\n_¿Me confirmas disponibilidad y tiempo estimado de entrega? Muchas gracias._`;

      return `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`;
    }

    window.addToCart = function(productId) {
      const b = state.selectedBusiness;
      if (!b) return;

      if (state.currentBusinessInCart && state.currentBusinessInCart.id !== b.id) {
        if (state.cart.length > 0) {
          if (!confirm(`Tienes productos de "${state.currentBusinessInCart.name}". ¿Deseas vaciar el carrito para pedir en "${esc(b.name)}"?`)) {
            return;
          }
          state.cart = [];
        }
      }

      state.currentBusinessInCart = b;
      const product = b.products.find(p => p.id === productId);
      if (product) {
        const existing = state.cart.find(i => i.id === product.id);
        if (existing) {
          existing.quantity += 1;
        } else {
          state.cart.push({ ...product, quantity: 1 });
        }
        saveState();
        renderApp();
      }
    };

    window.updateCartQty = function(productId, qty) {
      if (qty <= 0) {
        state.cart = state.cart.filter(i => i.id !== productId);
      } else {
        const item = state.cart.find(i => i.id === productId);
        if (item) item.quantity = qty;
      }
      if (state.cart.length === 0) state.currentBusinessInCart = null;
      saveState();
      renderApp();
    };

    window.showToast = function(message, type = 'info') {
      let toastContainer = document.getElementById('toast-container');
      if (!toastContainer) {
        toastContainer = document.createElement('div');
        toastContainer.id = 'toast-container';
        toastContainer.className = 'fixed bottom-5 right-5 z-60 flex flex-col gap-2 max-w-xs sm:max-w-sm w-full pointer-events-none px-4';
        document.body.appendChild(toastContainer);
      }

      const toast = document.createElement('div');
      const bgColors = {
        success: 'bg-emerald-800 text-white border-emerald-700',
        error: 'bg-rose-800 text-white border-rose-700',
        warning: 'bg-amber-800 text-white border-amber-700',
        info: 'bg-slate-900 text-white border-slate-800'
      };
      const icons = {
        success: '✓',
        error: '✕',
        warning: '⚠',
        info: 'ℹ'
      };

      toast.className = `${bgColors[type] || bgColors.info} border px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-xs font-medium pointer-events-auto transform translate-y-3 opacity-0 transition-all duration-300`;
      toast.innerHTML = `
        <span class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center font-bold text-xs shrink-0">${icons[type] || '•'}</span>
        <span class="flex-1 leading-snug">${message}</span>
      `;

      toastContainer.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-3', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-3');
        setTimeout(() => toast.remove(), 300);
      }, 4500);
    };

    window.uploadToSupabaseStorage = async function(blob, filename) {
      if (!supabaseClient || !supabaseClient.storage) return null;
      try {
        const bucket = 'photos';
        const path = `uploads/${Date.now()}-${filename.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
        const { data, error } = await supabaseClient.storage.from(bucket).upload(path, blob, {
          cacheControl: '3600',
          upsert: true
        });
        if (!error && data) {
          const { data: pubUrl } = supabaseClient.storage.from(bucket).getPublicUrl(path);
          return pubUrl?.publicUrl || null;
        }
      } catch (err) {
        console.warn('Storage upload fallback:', err);
      }
      return null;
    };

    window.handleImageUpload = function(event, targetInputId, previewId, type = 'cover') {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        window.showToast('Por favor selecciona un archivo de imagen válido (JPG, PNG, WebP).', 'warning');
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        window.showToast('La imagen no debe superar los 10MB.', 'warning');
        return;
      }

      state.imageAdjustState.filename = file.name || 'image.jpg';
      const reader = new FileReader();
      reader.onload = function(e) {
        const rawSrc = e.target.result;
        const testImg = new Image();
        testImg.onload = function() {
          state.imageAdjustState.rawImageSrc = rawSrc;
          state.imageAdjustState.targetInputId = targetInputId;
          state.imageAdjustState.previewId = previewId;
          state.imageAdjustState.type = type;
          state.imageAdjustState.naturalWidth = testImg.naturalWidth || testImg.width;
          state.imageAdjustState.naturalHeight = testImg.naturalHeight || testImg.height;

          // Calcular escala base para que la imagen completa quepa en el visor
          const isLogo = type === 'logo';
          const vpW = isLogo ? 320 : 480;
          const vpH = isLogo ? 320 : 270;
          const fitScale = Math.min(vpW / state.imageAdjustState.naturalWidth, vpH / state.imageAdjustState.naturalHeight);
          
          state.imageAdjustState.baseScale = fitScale;
          state.imageAdjustState.scale = 1; // 100% de la escala de encuadre
          state.imageAdjustState.offsetX = 0;
          state.imageAdjustState.offsetY = 0;

          // Abrir ajustador para encuadrarla inmediatamente
          state.modals.imageAdjust = true;
          renderApp();
        };
        testImg.src = rawSrc;
      };
      reader.readAsDataURL(file);
    };

    window.setImageZoom = function(val) {
      state.imageAdjustState.scale = parseFloat(val);
      const img = document.getElementById('crop-target-img');
      const lbl = document.getElementById('zoom-label');
      const effScale = (state.imageAdjustState.baseScale || 1) * state.imageAdjustState.scale;
      if (img) {
        img.style.transform = `translate(${state.imageAdjustState.offsetX}px, ${state.imageAdjustState.offsetY}px) scale(${effScale})`;
      }
      if (lbl) lbl.textContent = `${Math.round(state.imageAdjustState.scale * 100)}%`;
    };

    window.adjustZoom = function(delta) {
      let newScale = Math.min(3.0, Math.max(0.2, state.imageAdjustState.scale + delta));
      window.setImageZoom(newScale);
      const slider = document.querySelector('input[type="range"][oninput*="setImageZoom"]');
      if (slider) slider.value = newScale;
    };

    window.resetImageAdjust = function() {
      state.imageAdjustState.scale = 1;
      state.imageAdjustState.offsetX = 0;
      state.imageAdjustState.offsetY = 0;
      const img = document.getElementById('crop-target-img');
      const lbl = document.getElementById('zoom-label');
      const effScale = state.imageAdjustState.baseScale || 1;
      if (img) {
        img.style.transform = `translate(0px, 0px) scale(${effScale})`;
      }
      if (lbl) lbl.textContent = '100%';
      const slider = document.querySelector('input[type="range"][oninput*="setImageZoom"]');
      if (slider) slider.value = 1;
    };

    window.startImageDrag = function(e) {
      state.imageAdjustState.isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      state.imageAdjustState.startX = clientX - state.imageAdjustState.offsetX;
      state.imageAdjustState.startY = clientY - state.imageAdjustState.offsetY;

      const moveHandler = (moveEvent) => {
        if (!state.imageAdjustState.isDragging) return;
        const curX = moveEvent.touches ? moveEvent.touches[0].clientX : moveEvent.clientX;
        const curY = moveEvent.touches ? moveEvent.touches[0].clientY : moveEvent.clientY;
        state.imageAdjustState.offsetX = curX - state.imageAdjustState.startX;
        state.imageAdjustState.offsetY = curY - state.imageAdjustState.startY;
        const img = document.getElementById('crop-target-img');
        if (img) {
          const effScale = (state.imageAdjustState.baseScale || 1) * state.imageAdjustState.scale;
        img.style.transform = `translate(${state.imageAdjustState.offsetX}px, ${state.imageAdjustState.offsetY}px) scale(${effScale})`;
        }
      };

      const upHandler = () => {
        state.imageAdjustState.isDragging = false;
        window.removeEventListener('mousemove', moveHandler);
        window.removeEventListener('mouseup', upHandler);
        window.removeEventListener('touchmove', moveHandler);
        window.removeEventListener('touchend', upHandler);
      };

      window.addEventListener('mousemove', moveHandler);
      window.addEventListener('mouseup', upHandler);
      window.addEventListener('touchmove', moveHandler);
      window.addEventListener('touchend', upHandler);
    };

        // Guarda y restaura los valores del formulario de registro cuando se re-renderiza
    window.preserveAndRestoreRegisterForm = function(callback) {
      const snap = {
        name: document.getElementById('reg-name')?.value || '',
        cat: document.getElementById('reg-cat')?.value || '',
        wa: document.getElementById('reg-wa')?.value || '',
        desc: document.getElementById('reg-desc')?.value || '',
        cover: document.getElementById('reg-cover')?.value || state.registerDraft?.cover || '',
        logo: document.getElementById('reg-logo')?.value || state.registerDraft?.logo || '',
        addr: document.getElementById('reg-addr')?.value || '',
        ref: document.getElementById('reg-ref')?.value || '',
        locPhoto: document.getElementById('reg-loc-photo')?.value || '',
        hasDel: document.getElementById('reg-has-delivery')?.value || 'si',
        delCost: document.getElementById('reg-delivery-cost')?.value || '0',
        delMin: document.getElementById('reg-delivery-min')?.value || '',
        open: document.getElementById('reg-open')?.value || '08:00',
        close: document.getElementById('reg-close')?.value || '20:00',
        web: document.getElementById('reg-web')?.value || '',
        insta: document.getElementById('reg-insta')?.value || '',
        notes: document.getElementById('reg-notes')?.value || '',
        scheduleMode: document.querySelector('input[name="schedule_mode"]:checked')?.value || 'same',
        dayHours: {}
      };

      ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'].forEach(k => {
        snap.dayHours[k] = {
          active: document.getElementById(`reg-day-${k}-active`)?.checked ?? true,
          open: document.getElementById(`reg-day-${k}-open`)?.value || '08:00',
          close: document.getElementById(`reg-day-${k}-close`)?.value || '20:00'
        };
      });

      if (callback) callback();

      // Restaurar en el nuevo tick del DOM
      setTimeout(() => {
        if (!state.modals.register) return;
        if (document.getElementById('reg-name')) document.getElementById('reg-name').value = snap.name;
        if (document.getElementById('reg-cat')) document.getElementById('reg-cat').value = snap.cat;
        if (document.getElementById('reg-wa')) document.getElementById('reg-wa').value = snap.wa;
        if (document.getElementById('reg-desc')) document.getElementById('reg-desc').value = snap.desc;
        if (document.getElementById('reg-addr')) document.getElementById('reg-addr').value = snap.addr;
        if (document.getElementById('reg-ref')) document.getElementById('reg-ref').value = snap.ref;
        if (document.getElementById('reg-loc-photo')) document.getElementById('reg-loc-photo').value = snap.locPhoto;
        if (document.getElementById('reg-has-delivery')) document.getElementById('reg-has-delivery').value = snap.hasDel;
        if (document.getElementById('reg-delivery-cost')) document.getElementById('reg-delivery-cost').value = snap.delCost;
        if (document.getElementById('reg-delivery-min')) document.getElementById('reg-delivery-min').value = snap.delMin;
        if (document.getElementById('reg-open')) document.getElementById('reg-open').value = snap.open;
        if (document.getElementById('reg-close')) document.getElementById('reg-close').value = snap.close;
        if (document.getElementById('reg-web')) document.getElementById('reg-web').value = snap.web;
        if (document.getElementById('reg-insta')) document.getElementById('reg-insta').value = snap.insta;
        if (document.getElementById('reg-notes')) document.getElementById('reg-notes').value = snap.notes;

        // Restaurar portada
        if (snap.cover && document.getElementById('reg-cover')) {
          document.getElementById('reg-cover').value = snap.cover;
          const pc = document.getElementById('preview-cover');
          const phCover = document.getElementById('preview-cover-placeholder');
          const btnCover = document.getElementById('btn-adjust-cover');
          if (pc) { pc.src = snap.cover; pc.classList.remove('hidden'); }
          if (phCover) phCover.classList.add('hidden');
          if (btnCover) { btnCover.classList.remove('hidden'); btnCover.classList.add('inline-flex'); }
        }

        // Restaurar logo
        if (snap.logo && document.getElementById('reg-logo')) {
          document.getElementById('reg-logo').value = snap.logo;
          const pl = document.getElementById('preview-logo');
          const phLogo = document.getElementById('preview-logo-placeholder');
          const btnLogo = document.getElementById('btn-adjust-logo');
          if (pl) { pl.src = snap.logo; pl.classList.remove('hidden'); }
          if (phLogo) phLogo.classList.add('hidden');
          if (btnLogo) { btnLogo.classList.remove('hidden'); btnLogo.classList.add('inline-flex'); }
        }

        // Restaurar modo de horario
        if (snap.scheduleMode === 'custom') {
          const radioCustom = document.querySelector('input[name="schedule_mode"][value="custom"]');
          if (radioCustom) radioCustom.checked = true;
          window.toggleScheduleMode('custom');
        }

        // Restaurar días individuales
        Object.keys(snap.dayHours).forEach(k => {
          const conf = snap.dayHours[k];
          const cb = document.getElementById(`reg-day-${k}-active`);
          const openIn = document.getElementById(`reg-day-${k}-open`);
          const closeIn = document.getElementById(`reg-day-${k}-close`);

window.applyImageCrop = function() {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const isLogo = state.imageAdjustState.type === 'logo';
        const outWidth = isLogo ? 400 : 800;
        const outHeight = isLogo ? 400 : 450;
        canvas.width = outWidth;
        canvas.height = outHeight;
        const ctx = canvas.getContext('2d');

        // Renderizar el recorte exacto en base al offset y zoom del viewport
        const viewport = document.getElementById('crop-viewport');
        const vpWidth = viewport ? viewport.clientWidth : outWidth;
        const vpHeight = viewport ? viewport.clientHeight : outHeight;
        
        const scaleRatio = outWidth / vpWidth;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, outWidth, outHeight);

        ctx.save();
        ctx.translate(outWidth / 2 + (state.imageAdjustState.offsetX * scaleRatio), outHeight / 2 + (state.imageAdjustState.offsetY * scaleRatio));
        const finalDrawScale = (state.imageAdjustState.baseScale || 1) * state.imageAdjustState.scale * scaleRatio;
        ctx.scale(finalDrawScale, finalDrawScale);
        ctx.drawImage(img, -img.width / 2, -img.height / 2);
        ctx.restore();

        const croppedBase64 = canvas.toDataURL('image/jpeg', 0.88);
        const targetInput = document.getElementById(state.imageAdjustState.targetInputId);
        if (targetInput) targetInput.value = croppedBase64;

        // Persistir en el estado global para que nunca se borre al ajustar la otra foto
        if (!state.registerDraft) state.registerDraft = {};
        if (state.imageAdjustState.targetInputId === 'reg-cover') {
          state.registerDraft.cover = croppedBase64;
        } else if (state.imageAdjustState.targetInputId === 'reg-logo') {
          state.registerDraft.logo = croppedBase64;
        }

        const currentPreviewId = state.imageAdjustState.previewId;

        // Actualizar vista previa en el DOM
        if (currentPreviewId === 'preview-logo') {
          const pl = document.getElementById('preview-logo');
          const phLogo = document.getElementById('preview-logo-placeholder');
          const btnLogo = document.getElementById('btn-adjust-logo');
          if (pl) {
            pl.src = croppedBase64;
            pl.classList.remove('hidden');
          }
          if (phLogo) phLogo.classList.add('hidden');
          if (btnLogo) {
            btnLogo.classList.remove('hidden');
            btnLogo.classList.add('inline-flex');
          }
        } else if (currentPreviewId === 'preview-cover') {
          const pc = document.getElementById('preview-cover');
          const phCover = document.getElementById('preview-cover-placeholder');
          const btnCover = document.getElementById('btn-adjust-cover');
          if (pc) {
            pc.src = croppedBase64;
            pc.classList.remove('hidden');
          }
          if (phCover) phCover.classList.add('hidden');
          if (btnCover) {
            btnCover.classList.remove('hidden');
            btnCover.classList.add('inline-flex');
          }
        } else if (currentPreviewId === 'preview-trans-photo') {
          const pt = document.getElementById('preview-trans-photo');
          const phTrans = document.getElementById('preview-trans-placeholder');
          if (pt) {
            pt.src = croppedBase64;
            pt.classList.remove('hidden');
          }
          if (phTrans) phTrans.classList.add('hidden');
        }

        // Intento asíncrono de subir a Supabase Storage en segundo plano
        canvas.toBlob(async function(blob) {
          if (blob && window.uploadToSupabaseStorage) {
            const cloudUrl = await window.uploadToSupabaseStorage(blob, state.imageAdjustState.filename || 'img.jpg');
            if (cloudUrl && targetInput) {
              targetInput.value = cloudUrl;
              console.log('[Supabase Storage] Foto guardada en la nube:', cloudUrl);
            }
          }
        }, 'image/jpeg', 0.88);

        state.modals.imageAdjust = false;

        // Cerrar ajustador y preservar campos del formulario
        window.preserveAndRestoreRegisterForm(() => {
          renderApp();
        });

        window.showToast('¡Imagen ajustada y guardada con éxito!', 'success');
      };
      img.src = state.imageAdjustState.rawImageSrc;
    };

        });
      } else {

        const openTime = document.getElementById('reg-open')?.value || '08:00';

        dayKeysMap.forEach(d => {

            close: closeTime,
            closed: !isSelected
          };

      // Guardar en Supabase Cloud
      if (supabaseClient) {
        try {
          const dbPayload = {
            id: bizData.id,
            owner_id: bizData.owner_id,
            name: bizData.name,
            category_slug: bizData.category_slug,
            category_name: bizData.category_name,
            description: bizData.description,

          };

          if (isEditing) {
            const { error } = await supabaseClient.from('businesses').update(dbPayload).eq('id', targetId);
            if (error) console.warn('Supabase update warning:', error);
          } else {
            const { error } = await supabaseClient.from('businesses').insert([dbPayload]);
            if (error) console.warn('Supabase insert warning:', error);

        } catch (e) {
          console.warn('Error saving business to cloud:', e);

      }

      if (isEditing) {
        const idx = state.businesses.findIndex(b => b.id === targetId);
        if (idx !== -1) {

    // Procesar retorno de Google OAuth (Soporta #access_token en URL y supabase.auth.getSession)
    async function processGoogleAuthReturn() {
      try {
        let userFound = null;

        // 1. Verificar si viene el hash #access_token= en la barra de direcciones
        const hash = window.location.hash;
        if (hash && hash.includes('access_token=')) {
          const params = new URLSearchParams(hash.substring(1));
          const accessToken = params.get('access_token');
          if (accessToken && supabaseClient) {
            try {
              const { data: { user }, error } = await supabaseClient.auth.getUser(accessToken);
              if (user && !error) {
                userFound = user;
              }
            } catch (e) {
              console.warn('getUser with token error:', e);
            }
          }
        }

        // 2. Si no, verificar sesión almacenada en Supabase
        if (!userFound && supabaseClient) {
          try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
              userFound = session.user;
            }
          } catch (e) {
            console.warn('getSession error:', e);
          }
        }

        // 3. Si encontramos el usuario de Google, actualizar la aplicación
        if (userFound) {
          const email = (userFound.email || '').toLowerCase();
          const isAdmin = email.includes('andresc.15042010@gmail.com');
          const meta = userFound.user_metadata || {};
          const fullName = meta.full_name || meta.name || (isAdmin ? 'Administrador' : (email.split('@')[0].charAt(0).toUpperCase() + email.split('@')[0].slice(1)));
          const avatar = meta.avatar_url || meta.picture || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100';

          if (state.bannedUsers.includes(userFound.id) || state.bannedUsers.includes(email)) {
            window.showToast('⛔ Esta cuenta ha sido suspendida o bloqueada por la administración de Cisneros Emprende.', 'error');
            return;
          }

          const newAccountObj = {
            id: userFound.id,
            email: email,
            full_name: fullName,
            role: isAdmin ? 'admin' : 'user',
            avatar_url: avatar
          };

          state.currentUser = newAccountObj;

          // Registrar en savedAccounts si no existe
          if (!state.savedAccounts) state.savedAccounts = [];
          const existsIdx = state.savedAccounts.findIndex(a => a.id === userFound.id || a.email === email);
          if (existsIdx >= 0) {
            state.savedAccounts[existsIdx] = newAccountObj;
          } else {
            state.savedAccounts.push(newAccountObj);
          }

          // Limpiar el hash feo de la URL sin recargar la página
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', window.location.pathname + window.location.search);
          }

          saveState();
          state.modals.login = false;
          state.modals.accountSwitcher = false;
          renderApp();
          window.showToast(`¡Bienvenido/a, ${fullName}! Sesión iniciada con Google.`, 'success');
        }
      } catch (err) {
        console.error('Error procesando autenticación de Google:', err);
      }
    }

    // SEGURIDAD: Rate Limiting para intentos de login (anti-fuerza-bruta)
    // =========================================================================
    const loginAttempts = { count: 0, lastAttempt: 0, lockedUntil: 0 };

    function checkLoginRateLimit() {
      const now = Date.now();
      if (now < loginAttempts.lockedUntil) {
        const remaining = Math.ceil((loginAttempts.lockedUntil - now) / 1000);
        window.showToast(`⛔ Demasiados intentos fallidos. Espera ${remaining}s.`, 'error');
        return false;
      }
      if (now - loginAttempts.lastAttempt > 15 * 60 * 1000) {
        loginAttempts.count = 0; // Reset after 15 min
      }
      loginAttempts.count++;
      loginAttempts.lastAttempt = now;
      if (loginAttempts.count >= 5) {
        loginAttempts.lockedUntil = now + 5 * 60 * 1000; // 5 min lockout
        window.showToast('⛔ 5 intentos fallidos. Cuenta bloqueada por 5 minutos.', 'error');
        return false;
      }
      return true;
    }

    function resetLoginRateLimit() {
      loginAttempts.count = 0;
      loginAttempts.lockedUntil = 0;
    }

      } catch (err) {
        console.error('Error de autenticación por email:', err);
        let msg = err.message || 'Error al autenticar';
        if (msg.includes('Invalid login credentials')) {
          msg = 'Correo o contraseña incorrectos. Si no tienes cuenta, pulsa "Crear Cuenta".';
        } else if (msg.includes('User already registered')) {
          msg = 'Este correo ya tiene cuenta. Pulsa "Iniciar Sesión" para ingresar con tu contraseña.';
        }
        window.showToast(msg, 'error');
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>${state.authPendingType === 'signup' ? '✨ Crear Mi Cuenta' : '🔑 Entrar con Mi Correo'}</span>`;
        }
      }
    };

    
    // Pestañas del Panel Admin
    window.setAdminTab = function(tabName) {
      state.adminTab = tabName;
      renderApp();
    };

    // Alternar Insignia de Verificación Oficial
    window.toggleVerifiedBusiness = async function(id) {
      if (!state.currentUser || state.currentUser.role !== 'admin') {
        window.showToast('⛔ Acceso denegado. Esta acción es solo para administradores.', 'error');
        return;
      }
      const b = state.businesses.find(item => item.id === id);
      if (!b) return;
      b.is_verified = !b.is_verified;
      saveState();
      renderApp();

      if (supabaseClient) {
        try {
          await supabaseClient.from('businesses').update({ is_verified: b.is_verified }).eq('id', id);
        } catch (e) {
          console.warn('Supabase toggle verified notice:', e);
        }
      }

      window.showToast(b.is_verified ? `✓ "${esc(b.name)}" ahora tiene la insignia de Negocio Verificado.` : `Insignia removida de "${esc(b.name)}".`, 'info');
    };

    // Abrir Modal de Código QR
    window.showBusinessQr = function(id) {
      const b = state.businesses.find(item => item.id === id);
      if (!b) return;
      state.activeQrBusiness = b;
      state.modals.qrCode = true;
      renderApp();
    };

    // Descargar Imagen QR
    window.downloadQrImage = function(bizName) {
      const qrImg = document.querySelector('#qrcode-container img') || document.querySelector('#qrcode-container canvas');
      if (!qrImg) return;
      const link = document.createElement('a');
      link.download = `QR_${bizName.replace(/\s+/g, '_')}_CisnerosEmprende.png`;
      link.href = qrImg.src || (qrImg.toDataURL ? qrImg.toDataURL('image/png') : '');
      link.click();
      window.showToast('¡Descargando código QR!', 'success');
    };

    // Imprimir Ficha QR
    window.printQrCard = function() {
      window.print();
    };

    // Compartir Ficha de Negocio en WhatsApp
    window.shareBusinessOnWhatsApp = function(id) {
      const b = state.businesses.find(item => item.id === id);
      if (!b) return;
      const url = window.location.origin + window.location.pathname + '?biz=' + b.id;
      const text = `¡Hola! Mira los productos, menú y domicilios de *${b.name}* en el directorio de Cisneros Emprende: ${url}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      window.showToast('Abriendo WhatsApp para compartir...', 'success');
    };

    function bindEvents() {
      const brand = document.getElementById('nav-brand');
      if (brand) brand.onclick = () => { state.activeView = 'home'; renderApp(); };

      const btnSug = document.getElementById('btn-suggestion');
      if (btnSug) btnSug.onclick = () => window.openModal('suggestion');

      const btnReg = document.getElementById('btn-register-biz');
      if (btnReg) btnReg.onclick = () => window.startRegisterBusiness();

      const btnAdm = document.getElementById('btn-admin-panel');
      if (btnAdm) btnAdm.onclick = () => window.openModal('admin');

      const searchDesktop = document.getElementById('search-input');
      if (searchDesktop) {
        searchDesktop.oninput = (e) => {
          state.searchTerm = e.target.value;
          renderApp();
        };
      }

      const searchMobile = document.getElementById('search-input-mobile');
      if (searchMobile) {
        searchMobile.oninput = (e) => {
          state.searchTerm = e.target.value;
          renderApp();
        };
      }

      const btnAuth = document.getElementById('btn-toggle-auth');
      if (btnAuth) {
        btnAuth.onclick = async () => {
          if (state.currentUser) {
            if (supabaseClient) {
              try { await supabaseClient.auth.signOut(); } catch (e) {}
            }
            state.currentUser = null;
            saveState();
            renderApp();
            window.showToast('Sesión cerrada.', 'info');
          } else {
            window.openModal('login');
          }
        };
      }
    }

    // =========================================================================
    // GESTIÓN DE CACHÉ Y REGISTRO DE SERVICE WORKER PWA
    // =========================================================================
    const CURRENT_SW_VERSION = 'cisneros-emprende-v35';

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => {
            console.log('[PWA] Service Worker activo:', reg.scope);
            reg.update();
          })
          .catch(err => console.log('[PWA] SW notice:', err));
      });
    }

    // Purgar caches de versiones anteriores automáticamente
    if (typeof caches !== 'undefined') {
      caches.keys().then(names => {
        for (let name of names) {
          if (name !== CURRENT_SW_VERSION) {
            console.log('[PWA] Purgando cache antigua:', name);
            caches.delete(name);
          }
        }
      });
    }

    // Arranque blindado contra excepciones en tiempo de ejecución
    try {
      renderApp();
    } catch (err) {
      console.error('[Cisneros] Error en primer render:', err);
      const appEl = document.getElementById('app');
      if (appEl) {
        appEl.innerHTML = `
          <div class="min-h-screen flex flex-col items-center justify-center bg-slate-50 p-6 text-center">
            <div class="w-16 h-16 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-3xl mb-3">⚠️</div>
            <h2 class="text-lg font-black text-slate-900">Actualizando Cisneros Emprende</h2>
            <p class="text-xs text-slate-600 mt-1 max-w-sm">Detectamos una versión previa en tu navegador. Presiona el botón para cargar la última versión limpia.</p>
            <button onclick="localStorage.clear(); if(typeof caches!=='undefined'){caches.keys().then(k=>Promise.all(k.map(c=>caches.delete(c)))).then(()=>location.reload(true));}else{location.reload(true);}" class="mt-4 bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-md">
              🔄 Limpiar Caché y Entrar
            </button>
          </div>
        `;
      }
    }

    try {
      processGoogleAuthReturn();
    } catch (e) {
      console.warn('Google auth return error:', e);
    }


    // =========================================================================
    // SISTEMA DE PRESENCIA EN VIVO Y ANALÍTICA DE IP / USUARIOS EN LÍNEA
    // =========================================================================
    async function initRealtimePresence() {
      // 1. Obtener IP pública aproximada y ubicación de forma segura y silenciosa
      try {
        const ipRes = await fetch('https://api.ipify.org?format=json', { cache: 'no-store' });
        if (ipRes.ok) {
          const data = await ipRes.json();
          if (data && data.ip) {
            state.clientIpData.ip = data.ip;
          }
        }
      } catch (e) {
        state.clientIpData.ip = 'IP Móvil / Dinámica';
      }

      // 2. Si Supabase está disponible, usar Supabase Realtime Presence
      if (supabaseClient && typeof supabaseClient.channel === 'function') {
        try {
          const presenceChannel = supabaseClient.channel('cisneros-online-room', {
            config: {
              presence: {
                key: state.currentUser?.id || ('anon-' + Math.random().toString(36).substring(2, 9))
              }
            }
          });

          presenceChannel
            .on('presence', { event: 'sync' }, () => {
              const presenceState = presenceChannel.presenceState();
              const userList = [];
              Object.values(presenceState).forEach(presences => {
                presences.forEach(p => userList.push(p));
              });

              // Mínimo 1 (uno mismo)
              state.onlineUsersCount = Math.max(1, userList.length);
              state.onlinePresenceList = userList;

              // Actualizar el DOM directamente si está visible
              const countBadge = document.getElementById('live-online-count');
              if (countBadge) {
                countBadge.textContent = `${state.onlineUsersCount} en línea`;
              }
            })
            .subscribe(async (status) => {
              if (status === 'SUBSCRIBED') {
                const ua = navigator.userAgent;
                const device = /mobile/i.test(ua) ? 'Celular' : (/tablet|ipad/i.test(ua) ? 'Tablet' : 'Computador');
                await presenceChannel.track({
                  id: state.currentUser?.id || 'anon',
                  email: state.currentUser?.email || null,
                  name: state.currentUser?.name || state.currentUser?.user_metadata?.full_name || null,
                  role: state.currentUser?.role || 'visitor',
                  avatar: state.currentUser?.avatar_url || state.currentUser?.user_metadata?.avatar_url || null,
                  ip: state.clientIpData.ip,
                  city: 'Cisneros, Antioquia',
                  device: device,
                  online_at: new Date().toISOString()
                });
              }
            });
        } catch (err) {
          console.warn('[Presence] Realtime fallback:', err);
        }
      } else {
        // Simulación de base comunitaria activa (1 a 4 usuarios en línea locales)
        state.onlineUsersCount = Math.floor(Math.random() * 3) + 2;
      }
    }

    // Inicializar presencia en tiempo real
    initRealtimePresence();

    try {
      if (window.syncWithSupabase) window.syncWithSupabase();
    } catch (e) {
      console.warn('Supabase sync notice:', e);
    }
  </script>
</body>
</html>
