      businesses: JSON.parse(localStorage.getItem('cis_businesses')) || INITIAL_BUSINESSES,

      selectedCategory: 'all',
      searchTerm: '',
      activeView: 'home', // 'home', 'detail'
      selectedBusiness: null,
      currentUser: JSON.parse(localStorage.getItem('cis_user')) || null,
      menuDraft: [],
            // Estado de Autenticación
      authTab: 'login', // 'login' | 'register' | 'otp'
      authPendingEmail: '',
      authPendingType: 'signup', // 'signup' | 'login'
      authLoading: false,
      modals: {
        login: false,
        review: false,
        suggestion: false,
        report: false,
        register: false,
        admin: false
      }
    };

    function saveState() {
      localStorage.setItem('cis_businesses', JSON.stringify(state.businesses));
      localStorage.setItem('cis_reviews', JSON.stringify(state.reviews));
      localStorage.setItem('cis_suggestions', JSON.stringify(state.suggestions));
      localStorage.setItem('cis_reports', JSON.stringify(state.reports));
      localStorage.setItem('cis_favs', JSON.stringify(state.favorites));
      localStorage.setItem('cis_cart', JSON.stringify(state.cart));
      localStorage.setItem('cis_cart_biz', JSON.stringify(state.currentBusinessInCart));
      localStorage.setItem('cis_user', JSON.stringify(state.currentUser));
    }

    // =========================================================================
    // HELPER: HORARIOS COLOMBIA (Abierto / Cerrado)
    // =========================================================================
    function getBusinessStatus(schedule) {
      if (!schedule) return { isOpen: false, label: 'Consultar Horario', color: 'bg-slate-100 text-slate-700' };
      const now = new Date();
      const days = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
      const today = days[now.getDay()];
      const dayConf = schedule[today];
      if (!dayConf || dayConf.closed) return { isOpen: false, label: 'Cerrado hoy', color: 'bg-rose-50 text-rose-700 border-rose-200' };
      
      const currentMin = (now.getHours() * 60) + now.getMinutes();
      const [oh, om] = dayConf.open.split(':').map(Number);
      const [ch, cm] = dayConf.close.split(':').map(Number);
      const openMin = (oh * 60) + om;
      const closeMin = (ch * 60) + cm;

      if (currentMin >= openMin && currentMin < closeMin) {
        return { isOpen: true, label: `🟢 Abierto hasta las ${dayConf.close}`, color: 'bg-emerald-50 text-emerald-800 border-emerald-300' };
      }
      return { isOpen: false, label: `🔴 Cerrado (Abre hoy a las ${dayConf.open})`, color: 'bg-slate-100 text-slate-700 border-slate-300' };
    }

    // =========================================================================
    // HELPER: WHATSAPP MINI-CARRO FORMATTER
    // =========================================================================
    function getWhatsAppUrl(business, cart, details) {
      let cleanPhone = business.whatsapp_number.replace(/\D/g, '');
      if (!cleanPhone.startsWith('57')) cleanPhone = '57' + cleanPhone;

      const subtotal = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
      const delivery = business.delivery_available ? Number(business.delivery_cost || 0) : 0;
      const total = subtotal + delivery;

      let msg = `👋 *¡Hola, ${business.name}!* \n`;
      msg += `Vengo de la app *Cisneros Emprende* y quiero realizar este pedido:\n\n`;
      msg += `🛍️ *PRODUCTOS:*\n`;
      cart.forEach(i => {
        msg += `• *${i.quantity}x* ${i.name} ($${(i.price * i.quantity).toLocaleString('es-CO')})\n`;
      });
      msg += `\n💰 *VALOR TOTAL:*\n`;
      msg += `• Subtotal: $${subtotal.toLocaleString('es-CO')}\n`;
      msg += `• Domicilio: ${delivery === 0 ? '¡Gratis!' : `$${delivery.toLocaleString('es-CO')}`}\n`;
      msg += `👉 *TOTAL A PAGAR: $${total.toLocaleString('es-CO')}*\n\n`;
      msg += `📍 *DATOS DE ENTREGA EN CISNEROS:*\n`;
      msg += `• Dirección: ${details.address}\n`;
      if (details.reference) msg += `• Punto de referencia: ${details.reference}\n`;
      msg += `• Pago con: ${details.paymentMethod}\n`;
      if (details.name) msg += `• Nombre: ${details.name}\n`;
      msg += `\n_¿Me confirmas disponibilidad y tiempo estimado de entrega? Muchas gracias._`;

      return `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`;
    }

    // =========================================================================
    // RENDERIZADOR PRINCIPAL
    // =========================================================================
    const appContainer = document.getElementById('app');

    function renderApp() {
      const filteredBusinesses = state.businesses.filter(b => {
        if (b.status !== 'approved' && state.currentUser?.role !== 'admin') return false;
        const matchesCategory = state.selectedCategory === 'all' || b.category_slug === state.selectedCategory;
        const matchesSearch = !state.searchTerm || 
          b.name.toLowerCase().includes(state.searchTerm.toLowerCase()) || 
          (b.description && b.description.toLowerCase().includes(state.searchTerm.toLowerCase())) ||
          (b.written_address && b.written_address.toLowerCase().includes(state.searchTerm.toLowerCase()));
        return matchesCategory && matchesSearch;
      });

      const featuredBusiness = state.businesses.find(b => b.is_featured && b.status === 'approved');
      const cartCount = state.cart.reduce((sum, i) => sum + i.quantity, 0);

            <!-- Acciones Principales -->

              <button id="btn-suggestion" class="text-xs font-semibold text-slate-600 hover:text-emerald-800 px-2 py-1.5 rounded-lg hover:bg-slate-100 flex items-center gap-1">
                <span>📬</span> <span class="hidden md:inline">Buzón</span>

              <button id="btn-register-biz" class="text-xs font-bold bg-emerald-700 text-white px-3 py-1.5 rounded-xl hover:bg-emerald-800 flex items-center gap-1 shadow-xs transition-colors">

              </button>

              ${state.currentUser?.role === 'admin' ? `
                <button id="btn-admin-panel" class="text-xs font-black bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-amber-950 px-3 py-1.5 rounded-xl shadow-xs flex items-center gap-1.5 transition-all">
                  <span>👑</span> <span>Panel Cami</span>
                  ${state.businesses.filter(b => b.status === 'pending').length > 0 ? `
                    <span class="bg-rose-600 text-white text-[10px] font-black px-1.5 py-0.2 rounded-full animate-pulse">${state.businesses.filter(b => b.status === 'pending').length}</span>
                  ` : ''}
                </button>
              ` : ''}

              <!-- Autenticación Google / Perfil -->
              <div class="flex items-center gap-1.5 pl-2 border-l border-slate-200">

                ` : `
                  <button id="btn-toggle-auth" class="text-xs font-bold bg-white text-slate-800 border border-slate-300 hover:bg-slate-50 px-3 py-1.5 rounded-xl shadow-2xs flex items-center gap-1.5 transition-colors">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>

          <!-- Buscador móvil -->

        <!-- CUERPO PRINCIPAL -->

            </div>

            <!-- GRID DE NEGOCIOS O EMPTY STATE ACOGEDOR -->
            ${filteredBusinesses.length === 0 ? `
              <div class="bg-white rounded-3xl p-8 sm:p-14 text-center border border-slate-200 shadow-2xs mt-4 max-w-2xl mx-auto">

    // =========================================================================
    // VISTA DETALLE DE NEGOCIO
    // =========================================================================
    function renderDetailView() {
      const b = state.selectedBusiness;
      if (!b) return '';
      const status = getBusinessStatus(b.schedule);
      const isFav = state.favorites.includes(b.id);
      const isOrgullo = b.has_orgullo_cisneros || (b.avg_rating >= 4.6 && b.total_reviews >= 5);
      const bizReviews = state.reviews.filter(r => r.business_id === b.id);

      return `
        <div class="max-w-4xl mx-auto space-y-4">
          <button onclick="window.goBack()" class="text-xs font-bold text-emerald-800 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 px-3 py-1.5 rounded-xl flex items-center gap-1.5 shadow-2xs">

                <p class="text-xs sm:text-sm text-slate-600 mt-2 leading-relaxed">${b.description}</p>
              </div>

              <!-- Dirección Descriptiva Estricta -->
              <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl text-xs sm:text-sm flex items-start gap-3">

              <!-- Observaciones de Pedidos & Domicilios -->
              ${(b.delivery_available || b.order_notes) ? `

                  <div class="flex items-center gap-1.5 font-bold text-amber-950">
                    <span>🛵</span> <span>Condiciones de Domicilios & Pedidos:</span>
                  </div>
                  <p class="text-amber-900">
                    ${b.delivery_available 
                      ? (b.delivery_cost === 0 
                          ? '• Domicilio completamente <strong>Gratis</strong>.' 
                          : `• Tarifa de domicilio: <strong>$${Number(b.delivery_cost).toLocaleString('es-CO')}</strong>.` + (b.delivery_min_order > 0 ? ` (¡Gratis a partir de $${Number(b.delivery_min_order).toLocaleString('es-CO')}!)` : ''))

              <!-- Botones de Acción, Redes y Contacto -->
              <div class="space-y-2 pt-1">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">

                    <span>💬</span> WhatsApp: ${b.whatsapp_number}

                  <button onclick="window.openModal('report')" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-3 px-4 rounded-2xl text-xs flex items-center justify-center gap-1 transition-colors">

                ${(b.website_url || b.instagram) ? `
                  <div class="flex items-center gap-2 pt-1">
                    ${b.website_url ? `
                      <a href="${b.website_url}" target="_blank" class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-xl text-[11px] flex items-center gap-1 shadow-2xs">

                </div>
              </div>

              ${(!b.products || b.products.length === 0) ? `
                <div class="p-6 text-center text-slate-400 bg-white rounded-2xl border border-slate-200">

                  <p class="text-[11px] text-slate-500 mt-1">Pregúntale directamente a su WhatsApp por disponibilidad.</p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                      <a href="https://wa.me/57${b.whatsapp_number.replace(/\\D/g, '')}?text=Hola%2C%20quisiera%20pedir%20el%20producto%3A%20*${encodeURIComponent(p.name)}*%20que%20vi%20en%20Cisneros%20Emprende" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1 shadow-xs transition-colors">
                        <span>Pedir</span> <span>💬</span>
                      </a>
                    </div>
                  `).join('')}
                </div>

            </div>

            <!-- Reseñas Verificadas de Google -->

              </div>

              <div class="space-y-3">
                ${bizReviews.map(r => `
                  <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 text-xs space-y-1">
                    <div class="flex justify-between items-center font-bold text-slate-800">
                      <span>${r.user_name}</span>
                      <span class="text-amber-500">${'★'.repeat(r.rating)}</span>
                    </div>
                    <p class="text-slate-600">"${r.comment}"</p>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

    // =========================================================================

      } else {

      }
      saveState();

    window.addToCart = function(productId) {
      const b = state.selectedBusiness;
      if (!b) return;

      if (state.currentBusinessInCart && state.currentBusinessInCart.id !== b.id) {
        if (state.cart.length > 0) {
          if (!confirm(`Tienes productos de "${state.currentBusinessInCart.name}". ¿Deseas vaciar el carrito para pedir en "${b.name}"?`)) {
            return;
          }
          state.cart = [];
        }
      }

      state.currentBusinessInCart = b;
      const product = b.products.find(p => p.id === productId);
      if (product) {
        const existing = state.cart.find(i => i.id === product.id);
        if (existing) {
          existing.quantity += 1;
        } else {
          state.cart.push({ ...product, quantity: 1 });
        }
        saveState();
        renderApp();
      }
    };

    window.updateCartQty = function(productId, qty) {
      if (qty <= 0) {
        state.cart = state.cart.filter(i => i.id !== productId);
      } else {
        const item = state.cart.find(i => i.id === productId);
        if (item) item.quantity = qty;
      }
      if (state.cart.length === 0) state.currentBusinessInCart = null;
      saveState();
      renderApp();
    };

    window.showToast = function(message, type = 'info') {
      let toastContainer = document.getElementById('toast-container');
      if (!toastContainer) {
        toastContainer = document.createElement('div');
        toastContainer.id = 'toast-container';
        toastContainer.className = 'fixed bottom-5 right-5 z-60 flex flex-col gap-2 max-w-xs sm:max-w-sm w-full pointer-events-none px-4';
        document.body.appendChild(toastContainer);
      }

      const toast = document.createElement('div');
      const bgColors = {
        success: 'bg-emerald-800 text-white border-emerald-700',
        error: 'bg-rose-800 text-white border-rose-700',
        warning: 'bg-amber-800 text-white border-amber-700',
        info: 'bg-slate-900 text-white border-slate-800'
      };
      const icons = {
        success: '✓',
        error: '✕',
        warning: '⚠',
        info: 'ℹ'
      };

      toast.className = `${bgColors[type] || bgColors.info} border px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-xs font-medium pointer-events-auto transform translate-y-3 opacity-0 transition-all duration-300`;
      toast.innerHTML = `
        <span class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center font-bold text-xs shrink-0">${icons[type] || '•'}</span>
        <span class="flex-1 leading-snug">${message}</span>
      `;

      toastContainer.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-3', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-3');
        setTimeout(() => toast.remove(), 300);
      }, 4500);
    };

    window.handleImageUpload = function(event, targetInputId, previewId) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        window.showToast('Por favor selecciona un archivo de imagen válido (JPG, PNG, WebP).', 'warning');
        return;
      }
      if (file.size > 8 * 1024 * 1024) {
        window.showToast('La imagen no debe superar los 8MB.', 'warning');
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 1200;
          let width = img.width;
          let height = img.height;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.82);
          const targetInput = document.getElementById(targetInputId);
          if (targetInput) targetInput.value = compressedBase64;
          const previewEl = document.getElementById(previewId);
          if (previewEl) {
            previewEl.src = compressedBase64;
            previewEl.classList.remove('hidden');
          }
          window.showToast('¡Foto cargada y optimizada con éxito!', 'success');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.submitSuggestion = async function() {
      const name = document.getElementById('sug-name')?.value.trim();
      const email = document.getElementById('sug-email')?.value.trim();
      const msg = document.getElementById('sug-msg')?.value.trim();

      const newSug = {
        id: (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : ('sug-' + Date.now()),
        sender_name: name || 'Ciudadano Cisneros',
        sender_email: email || null,
        message: msg,
        created_at: new Date().toISOString().split('T')[0]
      };

      if (supabaseClient) {
        try {
          await supabaseClient.from('suggestions').insert([{
            id: newSug.id,
            sender_name: newSug.sender_name,
            sender_email: newSug.sender_email,
            message: newSug.message
          }]);
        } catch (e) {
          console.warn('Error sending suggestion to Supabase:', e);
        }
      }

      state.suggestions.unshift(newSug);
      saveState();
      window.showToast('¡Muchas gracias! Tu sugerencia ha sido recibida en el buzón ciudadano.', "success");
      state.modals.suggestion = false;
      renderApp();
    };

    window.addDraftProduct = function() {
      const name = prompt('Nombre del plato, producto o servicio:');
      if (!name || !name.trim()) return;
      const priceStr = prompt('Precio en pesos colombianos (COP):', '10000');
      const price = Number(priceStr?.replace(/\D/g, '') || 0);
      const desc = prompt('Breve descripción o ingredientes (opcional):') || '';

      if (!state.menuDraft) state.menuDraft = [];
      state.menuDraft.push({
        id: 'p-' + Date.now(),
        name: name.trim(),
        price: price,
        description: desc.trim()
      });
      renderApp();
    };

    window.removeDraftProduct = function(index) {
      if (state.menuDraft && state.menuDraft[index]) {
        state.menuDraft.splice(index, 1);
        renderApp();
      }
    };

    window.submitBusiness = async function() {
      const name = document.getElementById('reg-name')?.value.trim();
      const cat = document.getElementById('reg-cat')?.value;
      const desc = document.getElementById('reg-desc')?.value.trim();
      const addr = document.getElementById('reg-addr')?.value.trim();
      const ref = document.getElementById('reg-ref')?.value.trim();
      const wa = document.getElementById('reg-wa')?.value.trim();
      const coverUrl = document.getElementById('reg-cover')?.value.trim();
      const logoUrl = document.getElementById('reg-logo')?.value.trim();
      const locPhoto = document.getElementById('reg-loc-photo')?.value.trim();
      const hasDel = document.getElementById('reg-has-delivery')?.value === 'si';
      const delCost = Number(document.getElementById('reg-delivery-cost')?.value || 0);
      const delMin = Number(document.getElementById('reg-delivery-min')?.value || 0);
      const openTime = document.getElementById('reg-open')?.value || '08:00';
      const closeTime = document.getElementById('reg-close')?.value || '20:00';
      const web = document.getElementById('reg-web')?.value.trim();
      const insta = document.getElementById('reg-insta')?.value.trim();
      const notes = document.getElementById('reg-notes')?.value.trim();

      const defaultCover = 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800';
      const covers = coverUrl ? [coverUrl] : [defaultCover];
      if (locPhoto) covers.push(locPhoto);

      const generatedId = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : ('biz-' + Date.now());
      const categoryItem = state.categories.find(c => c.slug === cat);
      const statusValue = (state.currentUser?.role === 'admin') ? 'approved' : 'pending';

      const newBiz = {
        id: generatedId,
        owner_id: state.currentUser?.id || null,
        name,
        category_slug: cat,
        category_name: categoryItem?.name || 'Comercio',
        description: desc,
        written_address: addr,
        reference_point: ref,
        whatsapp_number: wa,
        logo_url: logoUrl || null,
        website_url: web || null,
        instagram_url: insta || null,
        order_notes: notes || null,
        delivery_available: hasDel,
        delivery_cost: delCost,
        delivery_minimum: delMin,
        delivery_min_order: delMin,
        status: statusValue,
        is_featured: false,
        avg_rating: 0,
        total_reviews: 0,
        total_favorites: 0,
        cover_images: covers,
        schedule: {
          lunes: { open: openTime, close: closeTime, closed: false },
          martes: { open: openTime, close: closeTime, closed: false },
          miercoles: { open: openTime, close: closeTime, closed: false },
          jueves: { open: openTime, close: closeTime, closed: false },
          viernes: { open: openTime, close: closeTime, closed: false },
          sabado: { open: openTime, close: closeTime, closed: false },
          domingo: { open: openTime, close: closeTime, closed: false }
        },
        products: state.menuDraft ? [...state.menuDraft] : []
      };

      // Guardar en Supabase Cloud si está disponible
      if (supabaseClient) {
        try {
          const dbPayload = {
            id: newBiz.id,
            owner_id: newBiz.owner_id,
            name: newBiz.name,
            category_slug: newBiz.category_slug,
            category_name: newBiz.category_name,
            description: newBiz.description,
            written_address: newBiz.written_address,
            reference_point: newBiz.reference_point,
            whatsapp_number: newBiz.whatsapp_number,
            logo_url: newBiz.logo_url,
            website_url: newBiz.website_url,
            instagram_url: newBiz.instagram_url,
            order_notes: newBiz.order_notes,
            delivery_available: newBiz.delivery_available,
            delivery_cost: newBiz.delivery_cost,
            delivery_minimum: newBiz.delivery_minimum,
            status: newBiz.status,
            is_featured: false,
            avg_rating: 0,
            total_reviews: 0,
            total_favorites: 0,
            cover_images: newBiz.cover_images,
            schedule: newBiz.schedule,
            products: newBiz.products
          };
          const { error } = await supabaseClient.from('businesses').insert([dbPayload]);
          if (error) console.warn('Supabase insert warning:', error);
        } catch (e) {
          console.warn('Error saving business to cloud:', e);
        }
      }

      state.businesses.unshift(newBiz);
      state.menuDraft = []; // reset draft
      saveState();

      if (newBiz.status === 'approved') {
        window.showToast('¡Excelente Cami! Tu negocio ha quedado aprobado y publicado en la vitrina comercial.', 'success');
      } else {
        window.showToast('¡Emprendimiento registrado! Ha quedado en "Pendiente" para revisión y aprobación de Cami en el Panel Admin.', 'info');
      }

      state.modals.register = false;
      renderApp();
    };

    window.submitReview = function() {
      const b = state.selectedBusiness;
      const rating = Number(document.getElementById('rev-rating')?.value || 5);
      const comment = document.getElementById('rev-comment')?.value.trim();

      // Validación de 1 reseña por usuario por negocio
      const existing = state.reviews.find(r => r.business_id === b.id && r.user_name === state.currentUser?.full_name);
      if (existing) {
        window.showToast('Ya has dejado una reseña para este negocio. Para evitar spam, solo se permite 1 reseña por cuenta de Google.', "info");
        return;
      }

      state.reviews.unshift({
        id: 'rev-' + Date.now(),
        business_id: b.id,
        user_name: state.currentUser?.full_name || 'Usuario Cisneros',
        rating,
        comment,
        created_at: new Date().toISOString().split('T')[0]
      });

      // Recalcular promedio del negocio
      const bizReviews = state.reviews.filter(r => r.business_id === b.id);
      const avg = (bizReviews.reduce((sum, r) => sum + r.rating, 0) / bizReviews.length).toFixed(1);
      b.avg_rating = Number(avg);
      b.total_reviews = bizReviews.length;

      saveState();
      window.showToast('¡Tu reseña ha sido publicada con éxito!', "info");
      state.modals.review = false;
      renderApp();
    };

    window.submitReport = function() {
      const b = state.selectedBusiness;
      const reason = document.getElementById('rep-reason')?.value;
      const detail = document.getElementById('rep-detail')?.value.trim();

      state.reports.unshift({
        id: 'rep-' + Date.now(),
        business_id: b.id,
        business_name: b.name,
        reason,
        details: detail,
        created_at: new Date().toISOString().split('T')[0]
      });
      saveState();
      window.showToast('Reporte enviado a moderación. Gracias por ayudar a la comunidad de Cisneros.', "info");
      state.modals.report = false;
      renderApp();
    };

    window.approveBusiness = async function(id) {
      const b = state.businesses.find(item => item.id === id);
      if (b) {
        b.status = 'approved';
        saveState();
        if (supabaseClient) {
          try {
            await supabaseClient.from('businesses').update({ status: 'approved' }).eq('id', id);
          } catch (e) {
            console.warn('Error approving in Supabase:', e);
          }
        }
        window.showToast(`¡El comercio "${b.name}" ha sido aprobado y ya es visible en Cisneros!`, 'success');
        renderApp();
      }
    };

    window.rejectBusiness = async function(id) {
      const b = state.businesses.find(item => item.id === id);
      const name = b ? b.name : 'comercio';
      state.businesses = state.businesses.filter(item => item.id !== id);
      saveState();
      if (supabaseClient) {
        try {
          await supabaseClient.from('businesses').delete().eq('id', id);
        } catch (e) {
          console.warn('Error rejecting in Supabase:', e);
        }
      }
      window.showToast(`Se ha retirado el comercio "${name}".`, 'info');
      renderApp();
    };

    window.setFeatured = async function(id) {
      state.businesses.forEach(b => {
        b.is_featured = (b.id === id);
      });
      saveState();
      if (supabaseClient) {
        try {
          await supabaseClient.from('businesses').update({ is_featured: false }).neq('id', id);
          await supabaseClient.from('businesses').update({ is_featured: true }).eq('id', id);
        } catch (e) {
          console.warn('Error setting featured in Supabase:', e);
        }
      }
      renderApp();
    };

    window.deleteSuggestion = async function(id) {
      state.suggestions = state.suggestions.filter(s => s.id !== id);
      saveState();
      if (supabaseClient) {
        try {
          await supabaseClient.from('suggestions').delete().eq('id', id);
        } catch (e) {
          console.warn('Error deleting suggestion in Supabase:', e);
        }
      }
      window.showToast('Mensaje eliminado del buzón.', 'info');
      renderApp();
    };

    window.syncWithSupabase = async function() {
      if (!supabaseClient) return;
      try {
        // 1. Cargar negocios de la nube
        const { data: cloudBiz, error: errBiz } = await supabaseClient
          .from('businesses')
          .select('*')
          .order('created_at', { ascending: false });

        if (!errBiz && cloudBiz && cloudBiz.length > 0) {
          // Fusionar con negocios locales
          const merged = [...cloudBiz];
          state.businesses.forEach(localB => {
            if (!merged.some(cb => cb.id === localB.id)) {
              merged.push(localB);
            }
          });
          state.businesses = merged;
          saveState();
        }

        // 2. Cargar sugerencias de la nube
        const { data: cloudSug, error: errSug } = await supabaseClient
          .from('suggestions')
          .select('*')
          .order('created_at', { ascending: false });

        if (!errSug && cloudSug) {
          state.suggestions = cloudSug;
          saveState();
        }

        renderApp();
      } catch (err) {
        console.warn('Supabase sync notice:', err);
      }
    };

                    // =========================================================================
    // GOOGLE OAUTH 2.0 OFICIAL & DETECCIÓN AUTOMÁTICA DE RETORNO
    // =========================================================================
    window.triggerOfficialGoogleOAuth = async function() {
      const redirectUrl = window.location.origin + window.location.pathname;
      try {
        if (supabaseClient) {
          const { data, error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: redirectUrl
            }
          });
          if (error) throw error;
        } else {
          throw new Error('Supabase Client not loaded');
        }
      } catch (err) {
        console.warn('OAuth standard fallback:', err);
        const authUrl = `${SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(redirectUrl)}`;
        window.location.href = authUrl;
      }
    };

    // Procesar retorno de Google OAuth (Soporta #access_token en URL y supabase.auth.getSession)
    async function processGoogleAuthReturn() {
      try {
        let userFound = null;

        // 1. Verificar si viene el hash #access_token= en la barra de direcciones
        const hash = window.location.hash;
        if (hash && hash.includes('access_token=')) {
          const params = new URLSearchParams(hash.substring(1));
          const accessToken = params.get('access_token');
          if (accessToken && supabaseClient) {
            try {
              const { data: { user }, error } = await supabaseClient.auth.getUser(accessToken);
              if (user && !error) {
                userFound = user;
              }
            } catch (e) {
              console.warn('getUser with token error:', e);
            }
          }
        }

        // 2. Si no, verificar sesión almacenada en Supabase
        if (!userFound && supabaseClient) {
          try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
              userFound = session.user;
            }
          } catch (e) {
            console.warn('getSession error:', e);
          }
        }

        // 3. Si encontramos el usuario de Google, actualizar la aplicación
        if (userFound) {
          const email = (userFound.email || '').toLowerCase();
          const isAdmin = email.includes('andresc.15042010@gmail.com');
          const meta = userFound.user_metadata || {};
          const fullName = meta.full_name || meta.name || (isAdmin ? 'Cami (Admin)' : (email.split('@')[0].charAt(0).toUpperCase() + email.split('@')[0].slice(1)));
          const avatar = meta.avatar_url || meta.picture || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100';

          state.currentUser = {
            id: userFound.id,
            email: email,
            full_name: fullName,
            role: isAdmin ? 'admin' : 'user',
            avatar_url: avatar
          };

          // Limpiar el hash feo de la URL sin recargar la página
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', window.location.pathname + window.location.search);
          }

          saveState();
          state.modals.login = false;
          renderApp();
          window.showToast(`¡Bienvenido/a, ${fullName}! Sesión iniciada con Google.`, 'success');
        }
      } catch (err) {
        console.error('Error procesando autenticación de Google:', err);
      }
    }

    window.loginWithGoogle = function() {
      state.modals.login = true;
      renderApp();
    };

    function bindEvents() {
      const brand = document.getElementById('nav-brand');
      if (brand) brand.onclick = () => { state.activeView = 'home'; renderApp(); };

      const btnSug = document.getElementById('btn-suggestion');
      if (btnSug) btnSug.onclick = () => window.openModal('suggestion');

      const btnReg = document.getElementById('btn-register-biz');
      if (btnReg) btnReg.onclick = () => window.openModal('register');

      const btnAdm = document.getElementById('btn-admin-panel');
      if (btnAdm) btnAdm.onclick = () => window.openModal('admin');

      const searchDesktop = document.getElementById('search-input');
      if (searchDesktop) {
        searchDesktop.oninput = (e) => {
          state.searchTerm = e.target.value;
          renderApp();
        };
      }

      const searchMobile = document.getElementById('search-input-mobile');
      if (searchMobile) {
        searchMobile.oninput = (e) => {
          state.searchTerm = e.target.value;
          renderApp();
        };
      }

      const btnAuth = document.getElementById('btn-toggle-auth');
      if (btnAuth) {
        btnAuth.onclick = () => {
          if (state.currentUser) {
            state.currentUser = null;
            saveState();
            renderApp();
          } else {
            window.openModal('login');
          }
        };
      }
    }

    // =========================================================================
    // REGISTRO DE SERVICE WORKER PARA INSTALABILIDAD PWA
    // =========================================================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[PWA] Service Worker registrado con éxito:', reg.scope))
          .catch(err => console.log('[PWA] Service Worker no registrado (normal en preview local):', err));
      });
    }

    // Arranque inicial
    renderApp();
    processGoogleAuthReturn();
    if (window.syncWithSupabase) window.syncWithSupabase();
  </script>
